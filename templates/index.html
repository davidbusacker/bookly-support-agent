<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookly Support</title>
<style>
  :root {
    --paper: #f4efe4;
    --paper-dim: #e9e1d0;
    --ink: #21262e;
    --spine: #7a3030;
    --spine-dim: #a85c5c;
    --agent-bg: #21262e;
    --agent-text: #f4efe4;
    --user-bg: #ffffff;
    --user-text: #21262e;
    --peek-bg: #1a1e24;
    --peek-line: #3a424e;
    --peek-muted: #8b93a0;
    --peek-accent: #d4a574;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100vh;
  }
  .shell {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 300px;
    height: 100vh;
    max-width: 1100px;
    margin: 0 auto;
  }
  .app {
    display: flex;
    flex-direction: column;
    min-width: 0;
    height: 100vh;
    border-right: 1px solid var(--paper-dim);
  }
  header {
    padding: 22px 24px 16px;
    border-bottom: 1px solid var(--paper-dim);
  }
  header .brand {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 26px;
    font-weight: 700;
    color: var(--spine);
    letter-spacing: 0.3px;
  }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 4px;
    font-size: 14.5px;
    line-height: 1.45;
    white-space: pre-wrap;
  }
  .msg.agent {
    align-self: flex-start;
    background: var(--agent-bg);
    color: var(--agent-text);
    border-left: 3px solid var(--spine-dim);
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user-bg);
    color: var(--user-text);
    border: 1px solid var(--paper-dim);
  }
  .msg.error {
    align-self: center;
    background: #fbe6e6;
    color: #7a3030;
    font-size: 13px;
  }
  .typing {
    align-self: flex-start;
    color: #6b6558;
    font-size: 13px;
    font-style: italic;
    padding-left: 14px;
  }
  form#composer {
    display: flex;
    gap: 8px;
    padding: 16px 20px 20px;
    border-top: 1px solid var(--paper-dim);
  }
  #textInput {
    flex: 1;
    padding: 12px 14px;
    border-radius: 4px;
    border: 1px solid var(--paper-dim);
    background: #fff;
    font-size: 14.5px;
    outline: none;
  }
  #textInput:focus { border-color: var(--spine-dim); }
  button {
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    padding: 0 16px;
  }
  #sendBtn { background: var(--spine); color: #fff; }
  #sendBtn:hover { background: #632626; }
  #sendBtn:disabled { opacity: 0.6; cursor: not-allowed; }
  #voiceToggleWrap {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    color: #6b6558;
    padding: 0 20px 10px;
  }

  /* Peek into the agent */
  .peek {
    display: flex;
    flex-direction: column;
    height: 100vh;
    background: var(--peek-bg);
    color: #e8eaed;
    min-width: 0;
  }
  .peek-header {
    padding: 18px 18px 12px;
    border-bottom: 1px solid var(--peek-line);
  }
  .peek-title {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--peek-accent);
    letter-spacing: 0.2px;
  }
  .peek-sub {
    font-size: 11.5px;
    color: var(--peek-muted);
    margin-top: 4px;
    line-height: 1.35;
  }
  #peekLog {
    flex: 1;
    overflow-y: auto;
    padding: 12px 14px 20px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .peek-empty {
    color: var(--peek-muted);
    font-size: 12.5px;
    font-style: italic;
    padding: 8px 4px;
  }
  .peek-turn {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px dashed var(--peek-line);
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--peek-muted);
  }
  .peek-turn:first-child {
    margin-top: 0;
    padding-top: 0;
    border-top: none;
  }
  .peek-item {
    display: flex;
    gap: 8px;
    align-items: flex-start;
    font-size: 12.5px;
    line-height: 1.35;
    color: #d5d9e0;
    animation: peekIn 0.18s ease-out;
  }
  .peek-item.active .peek-emoji {
    filter: none;
    transform: scale(1.05);
  }
  .peek-item.done { color: var(--peek-muted); }
  .peek-item.done .peek-emoji {
    opacity: 0.55;
  }
  .peek-emoji {
    width: 1.25em;
    flex-shrink: 0;
    text-align: center;
    line-height: 1.35;
    font-size: 13px;
  }
  .peek-text { min-width: 0; }
  @keyframes peekIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 820px) {
    .shell {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr 220px;
      height: 100vh;
    }
    .app { height: auto; min-height: 0; border-right: none; border-bottom: 1px solid var(--paper-dim); }
    .peek { height: auto; min-height: 0; }
  }
</style>
</head>
<body>
<div class="shell">
  <div class="app">
    <header>
      <div class="brand">Bookly Support</div>
    </header>

    <div id="voiceToggleWrap">
      <input type="checkbox" id="voiceToggle" checked>
      <label for="voiceToggle">Speak responses aloud (ElevenLabs TTS)</label>
    </div>

    <div id="log"></div>

    <form id="composer">
      <input type="text" id="textInput" placeholder="Ask about an order, a return, or shipping..." autocomplete="off">
      <button type="submit" id="sendBtn">Send</button>
    </form>
  </div>

  <aside class="peek" aria-label="Peek into the agent">
    <div class="peek-header">
      <div class="peek-title">Peek into the agent</div>
    </div>
    <div id="peekLog">
      <div class="peek-empty" id="peekEmpty">Waiting for the next turn…</div>
    </div>
  </aside>
</div>

<script>
let sessionId = null;
let isSending = false;
let currentAudio = null;
let peekTurn = 0;

const log = document.getElementById('log');
const peekLog = document.getElementById('peekLog');
const textInput = document.getElementById('textInput');
const composer = document.getElementById('composer');
const sendBtn = document.getElementById('sendBtn');
const voiceToggle = document.getElementById('voiceToggle');

function addMessage(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

function addTyping() {
  const div = document.createElement('div');
  div.className = 'typing';
  div.id = 'typingIndicator';
  div.textContent = 'Riley is typing…';
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

function setSending(active) {
  isSending = active;
  sendBtn.disabled = active;
  textInput.disabled = active;
}

function beginPeekTurn() {
  peekTurn += 1;
  const empty = document.getElementById('peekEmpty');
  if (empty) empty.remove();

  const marker = document.createElement('div');
  marker.className = 'peek-turn';
  marker.textContent = 'Turn ' + peekTurn;
  peekLog.appendChild(marker);

  const active = peekLog.querySelectorAll('.peek-item.active');
  active.forEach((el) => el.classList.remove('active'));
  peekLog.scrollTop = peekLog.scrollHeight;
}

function peekEmoji(text) {
  const t = (text || '').toLowerCase();
  if (t.startsWith('blocked') || t.includes('not authenticated')) return '🚫';
  if (t.includes('authenticated') && !t.includes('not ')) return '🔓';
  if (t.includes('customer message')) return '💬';
  if (t.includes('classifying intent') || t.startsWith('intent:')) return '🎯';
  if (t.includes('intent unclear') || t.includes('clarify')) return '❓';
  if (t.includes('verifying phone') || t.includes('last 4')) return '📱';
  if (t.includes('reading a policy') || t.includes('policy') || t.includes('faq')) return '📜';
  if (t.includes('looking up the order') || t.includes('listing past orders')) return '📦';
  if (t.includes('looking up the customer') || t.includes('looking up a title')) return '👤';
  if (t.includes('checking inventory') || t.includes('inventory')) return '📚';
  if (t.includes('opening a return') || t.includes('return')) return '↩️';
  if (t.includes('issuing a refund') || t.includes('updating a refund') || t.includes('refund')) return '💸';
  if (t.includes('cancelling')) return '🛑';
  if (t.includes('escalating') || t.includes('ticket')) return '🎫';
  if (t.includes('prior conversation') || t.includes('agent trace') || t.includes('logging turn') || t.includes('starting bookly')) return '🗂️';
  if (t.includes('reship')) return '🚚';
  if (t.includes('address')) return '🏠';
  if (t.includes('password')) return '🔑';
  if (t.includes('restock match')) return '✨';
  if (t.includes('no restock')) return '📭';
  if (t.includes('restock') || t.includes('checking prior traces')) return '🛒';
  if (t.includes('scoring resolution') || t.startsWith('resolution ')) return '📊';
  if (t.includes('asking if everything') || t.includes('waiting on customer')) return '✅';
  if (t.includes("checking if they're done") || t.includes("said they're done")) return '🏁';
  if (t.includes('riley is reasoning') || t.includes('writing reply')) return '✍️';
  if (t.includes('reply ready') || t.includes('turn complete') || t.includes('restock offer attached')) return '🟢';
  if (t.includes('error') || t.includes('network')) return '⚠️';
  if (t.includes('using ')) return '🛠️';
  return '•';
}

function addPeek(text) {
  if (!text) return;
  const prev = peekLog.querySelector('.peek-item.active');
  if (prev) {
    prev.classList.remove('active');
    prev.classList.add('done');
  }

  const row = document.createElement('div');
  row.className = 'peek-item active';
  row.innerHTML = '<span class="peek-emoji"></span><span class="peek-text"></span>';
  row.querySelector('.peek-emoji').textContent = peekEmoji(text);
  row.querySelector('.peek-text').textContent = text;
  peekLog.appendChild(row);
  peekLog.scrollTop = peekLog.scrollHeight;
}

function finishPeek(label) {
  if (label) addPeek(label);
  const active = peekLog.querySelector('.peek-item.active');
  if (active) {
    active.classList.remove('active');
    active.classList.add('done');
  }
}

async function initSession() {
  const res = await fetch('/api/session', { method: 'POST' });
  const data = await res.json();
  sessionId = data.session_id;

  const greeting = "Hey! Riley from Bookly support — what's up?";
  addMessage('agent', greeting);
  if (voiceToggle.checked) speak(greeting);
}

async function sendMessage(text) {
  const trimmed = text.trim();
  if (!trimmed || isSending) return;

  setSending(true);
  addMessage('user', trimmed);
  addTyping();
  beginPeekTurn();
  addPeek('Customer message received');

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId, message: trimmed }),
    });

    const ctype = res.headers.get('content-type') || '';
    if (ctype.includes('application/json') && !ctype.includes('ndjson')) {
      const data = await res.json();
      removeTyping();
      if (data.error) {
        addMessage('error', 'Error: ' + data.error);
        finishPeek('Error');
        return;
      }
      addMessage('agent', data.reply);
      finishPeek('Reply ready');
      if (voiceToggle.checked) speak(data.reply);
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    let agentDiv = null;
    let full = '';

    const ensureAgent = () => {
      if (!agentDiv) {
        removeTyping();
        agentDiv = addMessage('agent', '');
        addPeek('Writing reply');
      }
      return agentDiv;
    };

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, nl).trim();
        buf = buf.slice(nl + 1);
        if (!line) continue;
        const ev = JSON.parse(line);
        if (ev.type === 'status') {
          addPeek(ev.text);
          const el = document.getElementById('typingIndicator');
          if (el) el.textContent = ev.text || 'Riley is typing…';
        } else if (ev.type === 'delta') {
          ensureAgent();
          full += ev.text;
          agentDiv.textContent = full;
          log.scrollTop = log.scrollHeight;
        } else if (ev.type === 'done') {
          ensureAgent();
          full = ev.reply || full;
          agentDiv.textContent = full;
          if (ev.restock_offer) {
            finishPeek('Restock offer attached');
          } else if (ev.guardrail === 'resolution_confirm') {
            finishPeek('Waiting on customer confirm');
          } else if (ev.guardrail === 'intent_clarification') {
            finishPeek('Asked to clarify');
          } else {
            finishPeek('Turn complete');
          }
          if (voiceToggle.checked && full) speak(full);
        } else if (ev.type === 'error') {
          removeTyping();
          addMessage('error', 'Error: ' + ev.error);
          finishPeek('Error');
        }
      }
    }
    if (!agentDiv && full) {
      removeTyping();
      addMessage('agent', full);
      finishPeek('Turn complete');
    }
  } catch (err) {
    removeTyping();
    addMessage('error', 'Network error: ' + err.message);
    finishPeek('Network error');
  } finally {
    setSending(false);
    textInput.focus();
  }
}

async function speak(text) {
  try {
    if (currentAudio) {
      currentAudio.pause();
      currentAudio = null;
    }

    const res = await fetch('/api/tts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    });

    if (!res.ok) {
      console.warn('TTS failed:', await res.text());
      return;
    }

    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    currentAudio = new Audio(url);
    currentAudio.onended = () => URL.revokeObjectURL(url);
    await currentAudio.play();
  } catch (err) {
    console.warn('TTS playback failed', err);
  }
}

composer.addEventListener('submit', (e) => {
  e.preventDefault();
  const text = textInput.value.trim();
  if (!text) return;
  textInput.value = '';
  sendMessage(text);
});

initSession();
</script>
</body>
</html>
